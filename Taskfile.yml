version: "3"

tasks:
  orgamax:dev:
    desc: Startet den Standard-Entwicklungsserver für orgaMAX
    env:
      N8N_USER_FOLDER: "{{.TASKFILE_DIR}}"
    cmds:
      - pnpm build
      - pnpm dev:be

  orgamax:install:
    desc: Installiert die gelockten Dependencies für orgaMAX
    cmds:
      - pnpm install --frozen-lockfile

  orgamax:build:
    desc: Baut alle n8n-Packages für orgaMAX
    cmds:
      - pnpm build > build.log 2>&1

  orgamax:pack:
    desc: Erstellt die orgaMAX-Tarballs in .deploy
    cmds:
      - pnpm deploy:packages

  orgamax:mirror:
    desc: >-
      Spiegelt den validierten .deploy-Stand nach ../ErpApi/packages/<version>
      (Fallback: ../packages/<version>)
    cmds:
      - node scripts/mirror-deploy-packages.mjs

  orgamax:deploy:
    desc: Installiert, baut, packt und spiegelt die orgaMAX-Pakete
    cmds:
      - task: orgamax:install
      - task: orgamax:build
      - task: orgamax:pack
      - task: orgamax:mirror

  orgamax:erpapi-link:
    desc: >-
      Setzt die file:-Links in ErpApi/package.json auf den gespiegelten Stand.
      Greift in ein fremdes Projekt ein und läuft deshalb nicht in orgamax:deploy mit.
      Optionaler Zielpfad via CLI_ARGS, Default ../ErpApi
    cmds:
      - node scripts/link-erpapi-packages.mjs {{.CLI_ARGS}}
      # ErpApi nutzt npm, nicht pnpm. Der Install läuft dort, nicht hier:
      # `python tools/python/reinstall.py --all [--keep-node]`.
      # Ein pnpm install in ErpApi zerstört Lockfile und node_modules-Layout.
      # Details: ORGAMAX/ERPAPI_README.MD, Abschnitt "Install in ErpApi".

  orgamax:n8n-editor:
    desc: >-
      Baut die interne n8n-Editor-EXE (ORGAMAX/n8n-editor) mit dem editor-ui-Tarball aus
      .deploy -> ORGAMAX/n8n-editor/dist/n8n-editor.exe. Braucht vorher orgamax:pack. Nie an Kunden ausgeben.
    vars:
      EDITOR_TGZ:
        sh: |
          node -e "const f=require('fs').readdirSync('.deploy').filter(n=>/^n8n-editor-ui-\d.*\.tgz$/.test(n));if(f.length!==1){console.error('Erwartet genau einen n8n-editor-ui-Tarball in .deploy, gefunden: '+f.length+' (zuerst task orgamax:pack)');process.exit(1)}console.log(f[0])"
      N8N_VERSION: '{{.EDITOR_TGZ | trimPrefix "n8n-editor-ui-" | trimSuffix ".tgz"}}'
    cmds:
      - go run -C ORGAMAX/n8n-editor ./cmd/unpack "{{.ROOT_DIR}}/.deploy/{{.EDITOR_TGZ}}" editor-dist
      # App-Icon als .syso (gitignored), das go build im Paketverzeichnis selbst einbindet.
      - go run -C ORGAMAX/n8n-editor ./cmd/winres build/windows/icon.ico n8n-editor-res_windows_amd64.syso
      # Wails ohne CLI: dieselben Tags und das GUI-Subsystem wie `wails build`.
      - go build -C ORGAMAX/n8n-editor -trimpath -tags desktop,production -ldflags "-H windowsgui -s -w -X main.version={{.N8N_VERSION}}" -o "{{.ROOT_DIR}}/ORGAMAX/n8n-editor/dist/n8n-editor.exe" .

  orgamax:dry-run:
    desc: Listet die zu packenden orgaMAX-Pakete ohne Änderung auf
    cmds:
      - pnpm deploy:packages:dry-run
